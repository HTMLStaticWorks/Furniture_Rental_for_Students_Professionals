<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up | RentNest</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--color-surface-hover);
      padding: var(--spacing-4);
      position: relative;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      padding: var(--spacing-8);
      margin: 0 auto;
    }
    @media (max-width: 1023px) {
      .auth-card { max-width: 420px; }
    }
    @media (max-width: 639px) {
      .auth-card {
        width: 92%;
        padding: var(--spacing-6);
      }
    }
    a.auth-logo,
    [data-theme="dark"] a.auth-logo {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: var(--spacing-2);
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--color-heading);
      margin-bottom: var(--spacing-8);
      text-decoration: none;
    }
    .auth-logo i {
      color: var(--color-accent);
      font-size: 1.75rem;
    }
    
    .social-btn {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: var(--spacing-6) 0;
      color: var(--color-muted);
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid var(--color-border);
    }
    .divider::not(:empty)::before { margin-right: .25em; }
    .divider::not(:empty)::after { margin-left: .25em; }
    
    .floating-toggles {
      position: absolute;
      top: var(--spacing-6);
      right: var(--spacing-6);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    [dir="rtl"] .floating-toggles {
      right: auto;
      left: var(--spacing-6);
    }
    @media (max-width: 639px) {
      .auth-page {
        flex-direction: column;
        justify-content: center;
      }
      .floating-toggles {
        position: static;
        width: 92%;
        justify-content: flex-end;
        margin-bottom: var(--spacing-4);
      }
      [dir="rtl"] .floating-toggles {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  
  <div class="auth-page">
    <div class="floating-toggles">
      <button class="theme-toggle btn icon-btn btn-outline" aria-label="Toggle Dark Mode" style="width: 32px; height: 32px;">
        <i class="ri-moon-line"></i>
      </button>
      <button class="rtl-toggle btn icon-btn btn-outline" aria-label="Toggle RTL" style="width: 32px; height: 32px;">
        <i class="ri-arrow-left-right-line"></i>
      </button>
    </div>
    <div class="card auth-card animate zoom-in" style="position: relative;">

      <a href="index.html" class="auth-logo">
        <i class="ri-home-smile-line"></i>
        <span>RentNest</span>
      </a>
      
      <form action="dashboard/index.html">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Phone Number</label>
          <input type="tel" class="form-control" placeholder="+1 (555) 000-0000" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div style="position: relative;">
            <input type="password" class="form-control" placeholder="********" required style="padding-right: 2.5rem;">
            <button type="button" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-muted); padding: 0;" aria-label="Toggle password visibility" onclick="const input = this.previousElementSibling; input.type = input.type === 'password' ? 'text' : 'password'; this.firstElementChild.className = input.type === 'password' ? 'ri-eye-line' : 'ri-eye-off-line';">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div style="position: relative;">
            <input type="password" class="form-control" placeholder="********" required style="padding-right: 2.5rem;">
            <button type="button" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--color-muted); padding: 0;" aria-label="Toggle password visibility" onclick="const input = this.previousElementSibling; input.type = input.type === 'password' ? 'text' : 'password'; this.firstElementChild.className = input.type === 'password' ? 'ri-eye-line' : 'ri-eye-off-line';">
              <i class="ri-eye-line"></i>
            </button>
          </div>
        </div>
        
        <div class="form-group" style="display: flex; align-items: flex-start; gap: 8px;">
          <input type="checkbox" id="terms" required style="margin-top: 5px;">
          <label for="terms" style="margin: 0; color: var(--color-text); font-size: 0.875rem;">I agree to the <a href="terms.html">Terms of Service</a> and <a href="privacy.html">Privacy Policy</a>.</label>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Create Account</button>
      </form>
      
      <div class="divider">or continue with</div>
      
      <div style="display: flex; gap: var(--spacing-4); margin-bottom: var(--spacing-4);">
        <button class="btn btn-outline social-btn" aria-label="Google"><i class="ri-google-fill" style="font-size: 1.25rem; margin: 0;"></i></button>
        <button class="btn btn-outline social-btn" aria-label="Facebook"><i class="ri-facebook-fill" style="font-size: 1.25rem; margin: 0;"></i></button>
        <button class="btn btn-outline social-btn" aria-label="Apple"><i class="ri-apple-fill" style="font-size: 1.25rem; margin: 0;"></i></button>
      </div>
      
      <p class="text-center mt-4">Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
