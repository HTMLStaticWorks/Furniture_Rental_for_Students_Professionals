<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Payments | Dashboard</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/rtl.css">
</head>
<body>
  <div class="dashboard-layout">
    <aside class="dashboard-sidebar">
  <div class="sidebar-header">
    <a href="../index.html" class="sidebar-logo">
      <i class="ri-home-smile-line"></i>
      <span>RentNest</span>
    </a>
  </div>
  
  <nav class="sidebar-nav">
    <div class="sidebar-menu">
      <a href="index.html" class="nav-item-dashboard"><i class="ri-dashboard-line"></i> Dashboard</a>
      <a href="active-rentals.html" class="nav-item-rentals"><i class="ri-home-gear-line"></i> Active Rentals</a>
      <a href="payments.html" class="nav-item-payments"><i class="ri-money-dollar-circle-line"></i> Payments</a>
      <a href="billing.html" class="nav-item-billing"><i class="ri-bill-line"></i> Billing & Invoices</a>
      <a href="rental-history.html" class="nav-item-history"><i class="ri-history-line"></i> Rental History</a>
      <a href="notifications.html" class="nav-item-notifications"><i class="ri-notification-3-line"></i> Notifications <span class="badge badge-accent ml-auto">3</span></a>
      <a href="profile.html" class="nav-item-profile"><i class="ri-user-settings-line"></i> Profile</a>
      <a href="settings.html" class="nav-item-settings"><i class="ri-settings-4-line"></i> Settings</a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <a href="../index.html" class="btn btn-outline" style="width: 100%; border-color: var(--color-error); color: var(--color-error) !important;">
      <i class="ri-logout-box-r-line"></i> Logout
    </a>
  </div>
</aside>

    <main class="dashboard-main">
      <header class="dashboard-header">
        <div style="display: flex; align-items: center; gap: var(--spacing-4);">
          <button class="sidebar-toggle-btn"><i class="ri-menu-line"></i></button>
          <h2 style="margin: 0; font-size: 1.25rem;">Payments</h2>
        </div>
        <div class="nav-actions">
          <button class="theme-toggle" aria-label="Toggle Dark Mode"><i class="ri-moon-line"></i></button>
          <button class="rtl-toggle" aria-label="Toggle RTL"><i class="ri-arrow-left-right-line"></i></button>
          <div class="header-profile ml-4">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Profile">
          </div>
        </div>
      </header>
      
      <div class="dashboard-content">
        <div class="card p-6 mb-8 animate slide-up" style="max-width: 600px;">
          <h3 class="mb-4">Upcoming Payment</h3>
          <div style="display: flex; justify-content: space-between; align-items: center; padding-bottom: var(--spacing-4); border-bottom: 1px solid var(--color-border);">
            <div>
              <p class="text-muted" style="margin: 0;">Due Date: Sep 01, 2026</p>
              <h1 style="margin: 0; color: var(--color-primary);">$89.00</h1>
            </div>
            <button class="btn btn-primary">Pay Now</button>
          </div>
          <div style="margin-top: var(--spacing-4);">
            <h4>Payment Method</h4>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <p style="margin: 0;"><i class="ri-visa-line" style="font-size: 1.5rem; vertical-align: middle;"></i> **** **** **** 4242</p>
              <button class="btn btn-text">Update</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
  <script src="../assets/js/main.js"></script>
  <script src="../assets/js/dashboard.js"></script>
</body>
</html>
